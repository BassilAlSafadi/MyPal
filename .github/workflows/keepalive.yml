name: Keep services alive

on:
  schedule:
    # Every 4 minutes — free hosting tiers sleep after ~30 min of no traffic.
    # Pinging every 4 min keeps all six services warm at all times.
    - cron: '*/4 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # One step over all six services. Set each URL as a repository variable;
      # an unset one is skipped rather than failing the run.
      - name: Ping every MyPal service
        env:
          AUTH_URL: ${{ vars.AUTH_URL }}
          LISTINGS_URL: ${{ vars.LISTINGS_URL }}
          ORDERS_URL: ${{ vars.ORDERS_URL }}
          PAYMENTS_URL: ${{ vars.PAYMENTS_URL }}
          AI_URL: ${{ vars.AI_URL }}
          MESSAGING_URL: ${{ vars.MESSAGING_URL }}
        run: |
          for name in AUTH LISTINGS ORDERS PAYMENTS AI MESSAGING; do
            url_var="${name}_URL"
            url="${!url_var}"
            if [ -z "$url" ]; then
              echo "$name: no URL configured, skipping"
              continue
            fi
            if curl -sf --max-time 15 "${url%/}/health" -o /dev/null; then
              echo "$name: ok"
            else
              echo "$name: ping failed (may be waking up)"
            fi
          done
