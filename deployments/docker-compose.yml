# MyPal — six microservices, three Postgres databases, two Mongo databases, one Redis.
#
#   Frontend ──┬─→ ai        (Go)  → MongoDB  mypal_ai
#              ├─→ auth      (C#)  → Postgres mypal_auth
#              ├─→ messaging (Go)  → MongoDB  mypal_messaging
#              ├─→ orders    (C#)  ┐
#              ├─→ payments  (C#)  ┴→ Postgres mypal_orders   (shared)
#              └─→ listings  (C#)  → Postgres mypal_listings
#
# Every service also has a Redis cache with a 5 hour TTL.
#
# The three Postgres databases are separate databases on one server, so local
# development needs a single container while each service still gets its own
# connection string and its own migration history.

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: ankane/pgvector:v0.5.1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates mypal_auth, mypal_listings and mypal_orders on first boot.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:latest
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  # Local embedding service for semantic search (ONNX, no Python/torch/API key).
  # listings and ai both call it over PRODBERT_URL; neither of those defaulted
  # to this hostname before this service existed, so search ran degraded.
  prodbert:
    build:
      context: ../Backend/ProdBERT
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Services ───────────────────────────────────────────────────────────────
  auth:
    build:
      context: ../Backend/CSharp
      dockerfile: MyPal.Auth/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PORT=5000
      - AUTH_POSTGRES_URL=Host=postgres;Database=mypal_auth;Username=postgres;Password=postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-internal-token}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - FRONTEND_URL=http://localhost:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  listings:
    build:
      context: ../Backend/CSharp
      dockerfile: MyPal.Listings/Dockerfile
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      prodbert:
        condition: service_healthy
    environment:
      - PORT=5002
      - LISTINGS_POSTGRES_URL=Host=postgres;Database=mypal_listings;Username=postgres;Password=postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-internal-token}
      - AUTH_SERVICE_URL=http://auth:5000
      - PRODBERT_URL=${PRODBERT_URL:-http://prodbert:8001}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  orders:
    build:
      context: ../Backend/CSharp
      dockerfile: MyPal.Orders/Dockerfile
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
    environment:
      - PORT=5004
      - ORDERS_POSTGRES_URL=Host=postgres;Database=mypal_orders;Username=postgres;Password=postgres
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-internal-token}
      - AUTH_SERVICE_URL=http://auth:5000
      - LISTINGS_SERVICE_URL=http://listings:5002
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  payments:
    build:
      context: ../Backend/CSharp
      dockerfile: MyPal.Payments/Dockerfile
    ports:
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # Orders owns the mypal_orders schema, so its migrations must land first.
      orders:
        condition: service_started
    environment:
      - PORT=5005
      - PAYMENTS_POSTGRES_URL=Host=postgres;Database=mypal_orders;Username=postgres;Password=postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-internal-token}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai:
    build:
      context: ../Backend/Go
      dockerfile: Dockerfile.ai
    ports:
      - "5003:5003"
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      prodbert:
        condition: service_healthy
    environment:
      - PORT=5003
      - AI_MONGO_URL=mongodb://mongodb:27017
      - AI_MONGO_DB=mypal_ai
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-internal-token}
      - LISTINGS_SERVICE_URL=http://listings:5002
      - ORDERS_SERVICE_URL=http://orders:5004
      - PRODBERT_URL=${PRODBERT_URL:-http://prodbert:8001}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      # Model providers — unset keys degrade each node to its mock response.
      # GEMINI_API_KEY powers every chat model; HUGGING_FACE_API_KEY is only
      # for the Prompt-Guard security classifier.
      - HUGGING_FACE_API_KEY=${HUGGING_FACE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  messaging:
    build:
      context: ../Backend/Go
      dockerfile: Dockerfile.messaging
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      ai:
        condition: service_started
    environment:
      - PORT=5001
      - MESSAGING_MONGO_URL=mongodb://mongodb:27017
      - MESSAGING_MONGO_DB=mypal_messaging
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-internal-token}
      - AI_SERVICE_URL=http://ai:5003
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  mongodata:
