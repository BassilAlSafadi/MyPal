syntax = "proto3";

package mypal.user;
option go_package = "mypal/api/go/pb/user";
option csharp_namespace = "MyPal.API.Protos.User";

message UserProfile {
    string id = 1;
    string email = 2;
    string first_name = 3;
    string last_name = 4;
}

service UserService {
    rpc GetProfile(GetProfileRequest) returns (UserProfile);
}

message GetProfileRequest {
    string id = 1;
}
