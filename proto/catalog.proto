syntax = "proto3";

package mypal.catalog;
option go_package = "mypal/api/go/pb/catalog";
option csharp_namespace = "MyPal.API.Protos.Catalog";

import "google/protobuf/timestamp.proto";

enum ProductType {
    PRODUCT_TYPE_UNSPECIFIED = 0;
    PRODUCT_TYPE_PHYSICAL = 1;
    PRODUCT_TYPE_VIRTUAL = 2;
}

message PriceHistoryEntry {
    string id = 1;
    double old_price = 2;
    double new_price = 3;
    google.protobuf.Timestamp changed_at = 4;
}

message Product {
    string id = 1;
    string name = 2;
    string category = 3;
    ProductType product_type = 4; // Product Discriminator
    double current_price = 5;
    int32 stock_qty = 6;
    repeated PriceHistoryEntry price_history = 7; // Price History Tracking
    google.protobuf.Timestamp created_at = 8;
    google.protobuf.Timestamp updated_at = 9;
}

service CatalogService {
    rpc GetProduct(GetProductRequest) returns (Product);
    rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
}

message GetProductRequest {
    string id = 1;
}

message ListProductsRequest {
    string category = 1;
    int32 page_size = 2;
    string page_token = 3;
}

message ListProductsResponse {
    repeated Product products = 1;
    string next_page_token = 2;
}
