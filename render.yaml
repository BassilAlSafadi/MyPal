# MyPal — Render Blueprint (free tier, no credit card required)
#
# All services use plan: free — no credit card needed.
# Trade-off: services sleep after 15 min of inactivity; first request
# after sleep takes ~30s to wake up. Fine for a personal/demo project.
#
# Because free services can't be "private" (pserv), everything is type: web.
# Internal service URLs use Render's private network hostnames so they never
# go over the public internet even though they have public URLs too.
#
# HOW TO APPLY
#   Render Dashboard → Blueprints → New Blueprint Instance → Solly2005/MyPal
#   branch: deploy/render-vercel → fill in the sync:false secrets → Apply.

envVarGroups:
  - name: mypal-shared
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false

services:
  # ── Public API Gateway ──────────────────────────────────────────────────
  - type: web
    name: mypal-gateway
    runtime: docker
    repo: https://github.com/Solly2005/MyPal
    branch: deploy/render-vercel
    rootDir: Backend/Go
    dockerfilePath: ./Dockerfile.gateway
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: mypal-shared
      - key: MESSAGING_ENABLED
        value: "false"
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: POSTGRES_URL
        sync: false
      - key: CSHARP_MAIN_API_URL
        value: http://mypal-csharp:8080
      - key: GO_SUPPORT_URL
        value: http://mypal-support:5001
      - key: NODE_ORCHESTRATOR_URL
        value: http://mypal-node:5003
      - key: PRODBERT_URL
        value: http://mypal-node:5003
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ── C# Main API ─────────────────────────────────────────────────────────
  - type: web
    name: mypal-csharp
    runtime: docker
    repo: https://github.com/Solly2005/MyPal
    branch: deploy/render-vercel
    rootDir: Backend/CSharp
    dockerfilePath: ./MyPal.API/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - fromGroup: mypal-shared
      - key: PORT
        value: "8080"
      - key: POSTGRES_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── Node Orchestrator ────────────────────────────────────────────────────
  - type: web
    name: mypal-node
    runtime: docker
    repo: https://github.com/Solly2005/MyPal
    branch: deploy/render-vercel
    rootDir: Backend/Node
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5003"
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: HUGGING_FACE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ENABLE_LLM_FALLBACK
        value: "true"
      - key: tavily_api_key
        sync: false

  # ── Go Support ───────────────────────────────────────────────────────────
  - type: web
    name: mypal-support
    runtime: docker
    repo: https://github.com/Solly2005/MyPal
    branch: deploy/render-vercel
    rootDir: Backend/Go
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5001"
      - key: POSTGRES_URL
        sync: false
