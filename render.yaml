# MyPal — Render Blueprint (lean v1)
#
# Deploys 4 services: the public Go gateway + 3 private services (C# API,
# Node orchestrator, Go support). Uses the existing Supabase Postgres.
# NATS / Redis / MongoDB / Python ProdBERT are intentionally omitted for v1
# (messaging is disabled on the gateway via MESSAGING_ENABLED=false).
#
# HOW TO APPLY
#   1. Push this repo to GitHub (Solly2005/MyPal).
#   2. Render Dashboard → Blueprints → New Blueprint Instance → pick this repo.
#   3. When prompted, paste the secret values (keys marked `sync: false`).
#      See deployments/RENDER_DEPLOY.md for the exact strings to use.
#   4. After the gateway is live, set the frontend's VITE_API_GATEWAY to the
#      gateway URL, deploy the frontend to Vercel, then set CORS_ALLOWED_ORIGINS
#      on the gateway to the Vercel URL and redeploy.

envVarGroups:
  - name: mypal-shared
    envVars:
      # Must be identical on the gateway (verifies) and C# API (signs) JWTs.
      - key: JWT_SECRET
        sync: false

services:
  # ── Public API Gateway ──────────────────────────────────────────────────
  - type: web
    name: mypal-gateway
    runtime: docker
    repo: https://github.com/Solly2005/MyPal
    rootDir: Backend/Go
    dockerfilePath: ./Dockerfile.gateway
    plan: starter
    healthCheckPath: /health
    envVars:
      - fromGroup: mypal-shared
      - key: PORT
        value: "10000"
      - key: MESSAGING_ENABLED       # run without NATS
        value: "false"
      - key: INTERNAL_SERVICE_TOKEN  # required at boot; generated once
        generateValue: true
      - key: POSTGRES_URL            # postgres:// URI form (pgx) — Supabase pooler
        sync: false
      - key: CSHARP_MAIN_API_URL
        value: http://mypal-csharp:8080
      - key: GO_SUPPORT_URL
        value: http://mypal-support:5001
      - key: NODE_ORCHESTRATOR_URL
        value: http://mypal-node:5003
      - key: PRODBERT_URL            # ProdBERT not deployed in v1; internal semantic
        value: http://mypal-node:5003  # search degrades gracefully if unreachable
      - key: CORS_ALLOWED_ORIGINS    # set to your Vercel URL after the frontend deploy
        sync: false

  # ── C# Main API (private) ───────────────────────────────────────────────
  - type: pserv
    name: mypal-csharp
    runtime: docker
    repo: https://github.com/Solly2005/MyPal
    rootDir: Backend/CSharp
    dockerfilePath: ./MyPal.API/Dockerfile
    plan: starter
    envVars:
      - fromGroup: mypal-shared
      - key: PORT
        value: "8080"
      - key: POSTGRES_URL            # Npgsql keyword form: Host=...;Username=...;Password=...
        sync: false
      - key: GOOGLE_CLIENT_ID        # optional — leave blank to disable Google login
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL            # your Vercel URL (Google OAuth redirect target)
        sync: false

  # ── Node Orchestrator (private) ─────────────────────────────────────────
  - type: pserv
    name: mypal-node
    runtime: docker
    repo: https://github.com/Solly2005/MyPal
    rootDir: Backend/Node
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: "5003"
      - key: COHERE_API_KEY          # optional — AI search degrades without it
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ── Go Support (private) ────────────────────────────────────────────────
  - type: pserv
    name: mypal-support
    runtime: docker
    repo: https://github.com/Solly2005/MyPal
    rootDir: Backend/Go
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: "5001"
      - key: POSTGRES_URL            # postgres:// URI form (pgx) — Supabase pooler
        sync: false
