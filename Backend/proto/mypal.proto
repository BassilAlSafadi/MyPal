syntax = "proto3";
package mypal;

option csharp_namespace = "MyPal.API.GrpcServices.Proto";

import "google/protobuf/struct.proto";

// All RPCs use google.protobuf.Struct for both request and response.
//
// Request envelope fields:
//   body           (Struct)  - HTTP request body decoded as JSON object
//   query          (Struct)  - URL query parameters as string map
//   params         (Struct)  - URL path parameters as string map
//   user_id        (string)  - caller's user ID (from gateway JWT validation)
//   user_email     (string)  - caller's email
//   user_roles     (string)  - comma-separated roles
//   internal_token (string)  - service-to-service auth token
//
// Response envelope fields:
//   status    (number)    - HTTP status code
//   body      (Struct)    - response body as JSON object
//   set_cookie (ListValue) - optional Set-Cookie header values

// ─── C# Main API ─────────────────────────────────────────────────────────────

service AuthService {
  rpc Login(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Signup(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Refresh(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Logout(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc BootstrapSession(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service UserService {
  rpc GetMe(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc UpdateMe(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc UpdateLocation(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service ProductService {
  rpc ListProducts(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetProduct(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc CreateProduct(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc UpdateProduct(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteProduct(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service OrderService {
  rpc ListOrders(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetOrder(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc CreateOrder(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service CartService {
  rpc GetCart(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc AddItem(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc RemoveItem(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service WalletService {
  rpc GetWallet(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListTransactions(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Deposit(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Withdraw(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service WishlistService {
  rpc GetWishlist(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc AddItem(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc RemoveItem(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service NotificationService {
  rpc GetNotifications(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc MarkRead(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service ListingService {
  rpc GetListings(google.protobuf.Struct) returns (google.protobuf.Struct);
}

// ─── Node.js Orchestrator ────────────────────────────────────────────────────

service AgentService {
  rpc Orchestrate(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service AiService {
  rpc DeepSearch(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetDeepSearchQuota(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc FastSearch(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GlobalSearch(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetGlobalSearchQuota(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Translate(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Summarize(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ProductAsk(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc CleanText(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc Recommend(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetRecommendations(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service SellerService {
  rpc AnalyzeSeller(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc MapSummaries(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ReduceSummaries(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc AnalyzeListing(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GenerateReport(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetSellerReport(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service ChatService {
  rpc CreateThread(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc ListThreads(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetThread(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc DeleteThread(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc SendMessage(google.protobuf.Struct) returns (google.protobuf.Struct);
}

service HistoryService {
  rpc GetHistory(google.protobuf.Struct) returns (google.protobuf.Struct);
}

// ─── Go Support Service ──────────────────────────────────────────────────────

service SupportService {
  rpc ValidateSSQL(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc GetSellerSummary(google.protobuf.Struct) returns (google.protobuf.Struct);
}
